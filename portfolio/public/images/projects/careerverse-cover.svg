<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract cosmic illustration for CareerVerse AI: a constellation forming a guided career roadmap with a chatbot node">
  <defs>
    <radialGradient id="cv-bg" cx="70%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1b1a30"/>
      <stop offset="60%" stop-color="#10131f"/>
      <stop offset="100%" stop-color="#0B0E13"/>
    </radialGradient>
    <linearGradient id="cv-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <radialGradient id="cv-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cv-glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#cv-bg)"/>
  <circle cx="150" cy="100" r="190" fill="url(#cv-glow)"/>
  <circle cx="660" cy="400" r="160" fill="url(#cv-glow2)"/>

  <g fill="#F9FAFB">
    <circle cx="700" cy="80" r="1.5" opacity="0.7"/>
    <circle cx="60" cy="240" r="1.2" opacity="0.6"/>
    <circle cx="120" cy="60" r="1.1" opacity="0.5"/>
    <circle cx="740" cy="220" r="1.3" opacity="0.6"/>
    <circle cx="400" cy="30" r="1.2" opacity="0.5"/>
    <circle cx="30" cy="420" r="1.4" opacity="0.6"/>
  </g>

  <!-- roadmap constellation: 4 stages connecting into a guided path -->
  <g stroke="url(#cv-line)" stroke-width="2.5" opacity="0.85">
    <line x1="140" y1="330" x2="300" y2="230"/>
    <line x1="300" y1="230" x2="470" y2="290"/>
    <line x1="470" y1="290" x2="630" y2="180"/>
  </g>
  <g stroke="#4fe3d6" stroke-width="1.4" stroke-dasharray="3 5" opacity="0.4">
    <line x1="140" y1="330" x2="470" y2="290"/>
    <line x1="300" y1="230" x2="630" y2="180"/>
  </g>

  <!-- stage nodes: post-10th, post-12th, undergrad, postgrad -->
  <g>
    <circle cx="140" cy="330" r="22" fill="#161D27" stroke="#3B82F6" stroke-width="2"/>
    <text x="140" y="336" text-anchor="middle" font-family="monospace" font-size="12" fill="#9CA3AF">10</text>
  </g>
  <g>
    <circle cx="300" cy="230" r="26" fill="#161D27" stroke="#8B5CF6" stroke-width="2"/>
    <text x="300" y="236" text-anchor="middle" font-family="monospace" font-size="12" fill="#9CA3AF">12</text>
  </g>
  <g>
    <circle cx="470" cy="290" r="30" fill="#161D27" stroke="#14B8A6" stroke-width="2"/>
    <text x="470" y="296" text-anchor="middle" font-family="monospace" font-size="11" fill="#9CA3AF">UG</text>
  </g>
  <g>
    <circle cx="630" cy="180" r="34" fill="#161D27" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="630" y="186" text-anchor="middle" font-family="monospace" font-size="11" fill="#F9FAFB">PG</text>
  </g>

  <!-- scholarship badge sparkle near PG node -->
  <g stroke="#F59E0B" stroke-width="1.6" opacity="0.8">
    <path d="M672 138 l6 6 M672 150 l6 -6 M666 144 h14"/>
  </g>

  <!-- chatbot counsellor bubble -->
  <g>
    <rect x="500" y="380" width="180" height="70" rx="16" fill="#161D27" stroke="#2B3644"/>
    <path d="M540 450 l-14 20 v-20 z" fill="#161D27" stroke="#2B3644"/>
    <circle cx="530" cy="410" r="7" fill="#8B5CF6"/>
    <rect x="548" y="403" width="112" height="6" rx="3" fill="#9CA3AF" opacity="0.6"/>
    <rect x="548" y="417" width="80" height="6" rx="3" fill="#6B7280" opacity="0.5"/>
  </g>

  <!-- location pin (OpenStreetMap discovery) -->
  <g transform="translate(210,120)">
    <path d="M0 0 C -14 0 -24 10 -24 24 C -24 42 0 66 0 66 C 0 66 24 42 24 24 C 24 10 14 0 0 0 Z"
      fill="none" stroke="#14B8A6" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="24" r="7" fill="#14B8A6" opacity="0.8"/>
  </g>
</svg>
