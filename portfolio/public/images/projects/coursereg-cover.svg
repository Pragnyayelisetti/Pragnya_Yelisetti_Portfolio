<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract cosmic illustration for the course registration and report generator: a data grid module producing a report document">
  <defs>
    <radialGradient id="cr-bg" cx="20%" cy="80%" r="90%">
      <stop offset="0%" stop-color="#17222a"/>
      <stop offset="60%" stop-color="#0f151c"/>
      <stop offset="100%" stop-color="#0B0E13"/>
    </radialGradient>
    <linearGradient id="cr-doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2733"/>
      <stop offset="100%" stop-color="#161D27"/>
    </linearGradient>
    <radialGradient id="cr-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cr-glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#cr-bg)"/>
  <circle cx="620" cy="110" r="180" fill="url(#cr-glow)"/>
  <circle cx="120" cy="420" r="160" fill="url(#cr-glow2)"/>

  <g fill="#F9FAFB">
    <circle cx="80" cy="70" r="1.4" opacity="0.6"/>
    <circle cx="720" cy="60" r="1.2" opacity="0.55"/>
    <circle cx="740" cy="300" r="1.3" opacity="0.6"/>
    <circle cx="40" cy="200" r="1.1" opacity="0.5"/>
    <circle cx="400" cy="40" r="1.2" opacity="0.5"/>
  </g>

  <!-- database / module grid -->
  <g>
    <rect x="120" y="150" width="230" height="230" rx="14" fill="url(#cr-doc)" stroke="#2B3644"/>
    <g stroke="#2B3644">
      <line x1="120" y1="226" x2="350" y2="226"/>
      <line x1="120" y1="302" x2="350" y2="302"/>
      <line x1="196" y1="150" x2="196" y2="380"/>
      <line x1="272" y1="150" x2="272" y2="380"/>
    </g>
    <g fill="#14B8A6" opacity="0.85">
      <circle cx="158" cy="188" r="5"/>
      <circle cx="234" cy="264" r="5"/>
      <circle cx="310" cy="340" r="5"/>
    </g>
    <g fill="#9b7bff" opacity="0.7">
      <circle cx="234" cy="188" r="4"/>
      <circle cx="310" cy="264" r="4"/>
      <circle cx="158" cy="340" r="4"/>
    </g>
  </g>

  <!-- connecting flow to generated report -->
  <path d="M355 260 C 420 260, 420 260, 470 260" stroke="url(#cr-doc)" fill="none"/>
  <g stroke="#4fe3d6" stroke-width="2" fill="none" opacity="0.75">
    <path d="M355 260 H 470"/>
    <path d="M455 250 L470 260 L455 270"/>
  </g>

  <!-- generated report document -->
  <g>
    <rect x="490" y="120" width="170" height="220" rx="12" fill="url(#cr-doc)" stroke="#2B3644"/>
    <rect x="512" y="148" width="100" height="10" rx="3" fill="#F9FAFB" opacity="0.85"/>
    <rect x="512" y="172" width="126" height="6" rx="3" fill="#9CA3AF" opacity="0.55"/>
    <rect x="512" y="188" width="110" height="6" rx="3" fill="#9CA3AF" opacity="0.45"/>
    <rect x="512" y="204" width="120" height="6" rx="3" fill="#9CA3AF" opacity="0.45"/>

    <!-- mini bar chart -->
    <g fill="#3B82F6" opacity="0.85">
      <rect x="512" y="270" width="14" height="40"/>
      <rect x="534" y="250" width="14" height="60"/>
      <rect x="556" y="290" width="14" height="20"/>
      <rect x="578" y="240" width="14" height="70"/>
      <rect x="600" y="260" width="14" height="50"/>
    </g>
    <line x1="512" y1="310" x2="622" y2="310" stroke="#2B3644"/>
  </g>

  <!-- enrollment checkmarks orbiting -->
  <g stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.8">
    <path d="M700 200 l6 6 l12 -14"/>
    <circle cx="712" cy="200" r="22" opacity="0.4"/>
  </g>
</svg>
