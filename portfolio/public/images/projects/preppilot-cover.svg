<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract cosmic illustration for PrepPilot: an AI interview panel with a waveform and orbiting scan rings">
  <defs>
    <radialGradient id="pp-bg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1a2036"/>
      <stop offset="60%" stop-color="#0f1420"/>
      <stop offset="100%" stop-color="#0B0E13"/>
    </radialGradient>
    <linearGradient id="pp-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161D27"/>
      <stop offset="100%" stop-color="#1F2733"/>
    </linearGradient>
    <linearGradient id="pp-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="pp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pp-glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#pp-bg)"/>
  <circle cx="640" cy="120" r="180" fill="url(#pp-glow)"/>
  <circle cx="140" cy="380" r="170" fill="url(#pp-glow2)"/>

  <!-- scattered stars -->
  <g fill="#F9FAFB">
    <circle cx="60" cy="60" r="1.6" opacity="0.8"/>
    <circle cx="120" cy="140" r="1.1" opacity="0.5"/>
    <circle cx="720" cy="70" r="1.4" opacity="0.7"/>
    <circle cx="760" cy="260" r="1.1" opacity="0.5"/>
    <circle cx="40" cy="300" r="1.3" opacity="0.6"/>
    <circle cx="690" cy="420" r="1.4" opacity="0.6"/>
    <circle cx="380" cy="40" r="1.2" opacity="0.55"/>
  </g>

  <!-- orbit rings suggesting AI scanning -->
  <g fill="none" stroke="#4fe3d6" stroke-opacity="0.35">
    <ellipse cx="400" cy="250" rx="260" ry="90"/>
    <ellipse cx="400" cy="250" rx="200" ry="140" stroke="#9b7bff" stroke-opacity="0.3"/>
  </g>

  <!-- interview panel / screen -->
  <g>
    <rect x="230" y="150" width="340" height="220" rx="18" fill="url(#pp-panel)" stroke="#2B3644"/>
    <rect x="230" y="150" width="340" height="36" rx="18" fill="#161D27"/>
    <circle cx="252" cy="168" r="4" fill="#F43F5E" opacity="0.6"/>
    <circle cx="268" cy="168" r="4" fill="#F59E0B" opacity="0.6"/>
    <circle cx="284" cy="168" r="4" fill="#14B8A6" opacity="0.6"/>

    <!-- camera aperture -->
    <circle cx="400" cy="255" r="46" fill="none" stroke="#4fe3d6" stroke-width="2" opacity="0.8"/>
    <circle cx="400" cy="255" r="30" fill="none" stroke="#9b7bff" stroke-width="2" opacity="0.7"/>
    <circle cx="400" cy="255" r="8" fill="#4fe3d6"/>

    <!-- waveform -->
    <polyline points="260,330 285,330 300,300 315,345 330,318 345,330 365,330 380,305 395,340 415,320 430,330 450,330 465,308 480,332 500,330 540,330"
      fill="none" stroke="url(#pp-wave)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating AI feedback chip -->
  <g>
    <rect x="470" y="90" width="150" height="52" rx="12" fill="#161D27" stroke="#2B3644"/>
    <circle cx="494" cy="116" r="6" fill="#14B8A6"/>
    <rect x="512" y="106" width="90" height="6" rx="3" fill="#9CA3AF" opacity="0.6"/>
    <rect x="512" y="120" width="60" height="6" rx="3" fill="#6B7280" opacity="0.5"/>
  </g>

  <!-- proctoring focus brackets -->
  <g stroke="#4fe3d6" stroke-width="2" opacity="0.7" fill="none">
    <path d="M210 130 L210 150 M210 130 L232 130"/>
    <path d="M590 130 L590 150 M590 130 L568 130"/>
    <path d="M210 390 L210 370 M210 390 L232 390"/>
    <path d="M590 390 L590 370 M590 390 L568 390"/>
  </g>
</svg>
